- hosts: pbtest
  become: true

  vars_files:
    - vars.yaml

  handlers:
    - name: Restart Solr Service
      service: 
        name: solr
        state: restarted

  tasks:
    - name: Install Java 
      dnf: 
        name: java-25-openjdk
        state: present
    
    - name: Download Solr Tarball
      get_url:
        url: "https://www.apache.org/dyn/closer.lua/solr/solr/{{ solr_version }}/solr-{{ solr_version }}.tgz?action=download"
        dest: "{{ download_dir }}/solr-{{ solr_version }}.tgz"
        checksum: "{{ solr_checksum }}"

    - name: Expand Solr Tarball
      unarchive:
        src: "{{ download_dir }}/solr-{{ solr_version }}.tgz"
        dest: "{{ download_dir }}"
        remote_src: true
        creates: "{{ download_dir }}/solr-{{ solr_version }}/README"

    - name: Run Solr Installer Script 
      command: >
        {{ download_dir }}/solr-{{ solr_version }}/bin/install_solr_service.sh
        {{ download_dir }}/solr-{{ solr_version }}.tgz
        -i /opt
        -d /var/solr
        -u solr
        -s solr
        -p 8983
        creates={{ solr_dir }}/bin/solr

    - name: Ensure Solr Started and Enabled at Boot
      service:
        name: solr
        state: started
        enabled: true

  
